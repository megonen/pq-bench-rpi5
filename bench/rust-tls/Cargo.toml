[package]
name = "pqb-rust-tls"
version = "0.1.0"
edition = "2021"
description = "pq-bench-rpi5 rustls + aws-lc-rs TLS 1.3 handshake harness — mirrors bench/tls/bench_tls.c, emitting the same schema-2.0.0 rows with implementation:\"rustls-awslc\""
publish = false

[dependencies]
rustls = { version = "=0.23.42", default-features = false, features = ["aws_lc_rs", "std", "prefer-post-quantum"] }
rustls-post-quantum = { version = "=0.2.4", features = ["aws-lc-rs-unstable"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
# Direct dep for the aws-lc-rs PRICING rows (implementation:"aws-lc-rs"):
# the primitives the rustls handshakes actually execute. NOT an independent
# implementation (wraps the AWS-LC C library). "unstable" gates ML-DSA.
aws-lc-rs = { version = "=1.17.3", features = ["unstable"] }
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = false
